<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KlipBot Gestor de IA - Demonstração Automática</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#090a0d',
                        cardBg: '#111217',
                        cardBorder: '#1f2029',
                        accentGreen: '#10b981',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070707;
            color: #ececed;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(13, 14, 18, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Suavização de transições de entrada e saída */
        .fade-transition {
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Barras de progresso com animação calma */
        .bar-smooth {
            transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Transição do botão sem re-renderizar */
        .btn-smooth {
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }
    </style>
</head>
<body class="flex flex-col h-screen w-screen p-1.5 sm:p-2 bg-[#070707]">

    <!-- Moldura Principal do Simulador -->
    <div class="relative flex-1 w-full flex flex-col rounded-2xl border border-zinc-800/80 glass-panel shadow-2xl overflow-hidden">
        
        <!-- Luz ambiente sutil e discreta -->
        <div class="absolute -top-24 -left-24 w-52 h-52 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-52 h-52 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- 1. HEADER EXECUTIVO DISCRETO (SEM BOTÕES MANUAIS) -->
        <header class="relative z-10 px-3.5 py-2.5 sm:px-4 sm:py-3 bg-[#0d0e12]/90 border-b border-zinc-800/60 flex items-center justify-between shrink-0">
            <!-- Esquerda: Indicadores de janela + Identidade -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 opacity-60">
                    <span class="w-2.5 h-2.5 rounded-full bg-zinc-700"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-zinc-700"></span>
                    <span class="w-2.5 h-2.5 rounded-full bg-zinc-700"></span>
                </div>
                <div class="h-3.5 w-[1px] bg-zinc-800"></div>
                <div class="flex items-center gap-2">
                    <div class="w-5 h-5 rounded-md bg-emerald-950/80 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
                        <i class="fa-solid fa-wand-magic-sparkles text-[9px]"></i>
                    </div>
                    <span class="text-xs font-semibold text-zinc-200 tracking-tight">KlipBot <span class="text-emerald-400 font-medium">Gestor</span></span>
                </div>
            </div>

            <!-- Direita: Indicador sutil de piloto automático -->
            <div class="flex items-center gap-1.5 text-[10px] text-zinc-400 font-mono">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>conectado à barbearia</span>
            </div>
        </header>

        <!-- 2. PALCO DO DIÁLOGO (MOSTRA 1 PERGUNTA + 1 RESPOSTA COMPLETA SEM ROLAGEM) -->
        <main class="relative z-10 flex-1 px-4 py-3 sm:px-5 sm:py-4 flex flex-col justify-center overflow-hidden">
            <div id="exchangeStage" class="w-full flex flex-col space-y-3 fade-transition opacity-0 translate-y-2">
                <!-- Conteúdo montado dinamicamente via script com transições suaves -->
            </div>
        </main>

        <!-- 3. BARRA DE ENTRADA DISCRETA (RODAPÉ) -->
        <footer class="relative z-10 px-3.5 py-2.5 sm:px-4 sm:py-2.5 bg-[#0a0b0e]/80 border-t border-zinc-800/60 shrink-0">
            <div class="relative flex items-center">
                <div class="absolute left-3 flex items-center gap-2 pointer-events-none text-zinc-500">
                    <i class="fa-solid fa-wand-magic-sparkles text-[10px] text-zinc-500"></i>
                </div>
                <input 
                    type="text" 
                    id="mockPromptBar" 
                    placeholder="Pergunte qualquer coisa sobre a barbearia..." 
                    readonly 
                    class="w-full bg-[#121318] border border-zinc-800/70 rounded-xl py-1.5 pl-8 pr-16 text-[11px] text-zinc-400 placeholder-zinc-500 focus:outline-none cursor-default"
                />
                <div class="absolute right-2 flex items-center gap-1.5">
                    <span class="text-[9px] font-mono text-zinc-500">IA</span>
                    <div class="w-5 h-5 rounded-md bg-zinc-800/80 text-zinc-400 flex items-center justify-center text-[9px]">
                        <i class="fa-solid fa-arrow-up"></i>
                    </div>
                </div>
            </div>
        </footer>

    </div>

    <!-- SCRIPT DE TRANSIÇÃO SUAVIZADA E AUTOMÁTICA -->
    <script>
        const stage = document.getElementById('exchangeStage');
        const mockPromptBar = document.getElementById('mockPromptBar');

        let currentIdx = 0;
        let activeTimer = null;

        const CONVERSATIONS = [
            {
                // CASO 1: Retenção de Clientes
                user: "Quais clientes estão na hora de voltar e ainda não agendaram?",
                aiText: "Identifiquei 18 clientes que passaram do tempo médio de retorno (>28 dias). Juntos somam R$ 900 em receita recuperável.",
                promptHint: "Consultando intervalo de retorno dos clientes...",
                renderCardHTML: () => `
                    <div class="w-full bg-[#13141a] border border-zinc-800 rounded-xl p-3 space-y-2.5">
                        <div class="flex items-center justify-between border-b border-zinc-800/70 pb-2">
                            <span class="text-xs font-medium text-zinc-300 flex items-center gap-1.5">
                                <i class="fa-solid fa-users text-zinc-400 text-[11px]"></i> Retenção de Clientes
                            </span>
                            <span class="text-[10px] text-zinc-400 bg-zinc-800/80 border border-zinc-700/60 px-2 py-0.5 rounded-md font-mono">
                                18 clientes ausentes
                            </span>
                        </div>

                        <div class="flex items-center justify-between bg-zinc-900/60 border border-zinc-800/60 rounded-lg px-2.5 py-1.5">
                            <div>
                                <span class="text-[9px] text-zinc-500 uppercase tracking-wider block font-mono">Receita Recuperável</span>
                                <span class="text-sm font-semibold text-emerald-400 font-mono">R$ 900,00</span>
                            </div>
                            <div class="text-right">
                                <span class="text-[9px] text-zinc-500 block font-mono">Intervalo Médio</span>
                                <span class="text-xs text-zinc-300">32 dias sem corte</span>
                            </div>
                        </div>

                        <div class="space-y-1 text-[11px] text-zinc-400">
                            <div class="flex items-center justify-between py-0.5 border-b border-zinc-800/40">
                                <span class="text-zinc-300 font-medium">Lucas Mendes</span>
                                <span class="font-mono text-[10px] text-zinc-500">há 29 dias · Degradê</span>
                            </div>
                            <div class="flex items-center justify-between py-0.5">
                                <span class="text-zinc-300 font-medium">Rafael Silva</span>
                                <span class="font-mono text-[10px] text-zinc-500">há 34 dias · Social + Barba</span>
                            </div>
                        </div>

                        <div class="pt-0.5">
                            <div id="actionButtonSlot" class="btn-smooth w-full py-2 px-3 rounded-lg bg-emerald-950/70 border border-emerald-600/40 text-emerald-300 text-xs font-medium flex items-center justify-between">
                                <span class="flex items-center gap-2">
                                    <i id="actionBtnIcon" class="fa-brands fa-whatsapp text-emerald-400 text-xs"></i>
                                    <span id="actionBtnText">Disparar lembrete via WhatsApp</span>
                                </span>
                                <span id="actionBtnBadge" class="text-[10px] bg-emerald-900/80 text-emerald-200 px-2 py-0.5 rounded font-mono">18 contatos</span>
                            </div>
                        </div>
                    </div>
                `,
                onCompleteAction: () => {
                    const btn = document.getElementById('actionButtonSlot');
                    const icon = document.getElementById('actionBtnIcon');
                    const text = document.getElementById('actionBtnText');
                    const badge = document.getElementById('actionBtnBadge');
                    if (!btn) return;

                    btn.className = "btn-smooth w-full py-2 px-3 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center justify-between shadow-sm";
                    if (icon) icon.className = "fa-solid fa-check text-xs text-white";
                    if (text) text.innerText = "18 Lembretes enviados via WhatsApp";
                    if (badge) {
                        badge.className = "text-[10px] bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded font-mono";
                        badge.innerText = "Concluído";
                    }
                }
            },
            {
                // CASO 2: Ociosidade da Agenda
                user: "Onde minha agenda está mais vazia nesta semana?",
                aiText: "Sua taxa de ocupação média está em 78%, com maior ociosidade na quinta-feira à tarde (14h às 17h) com 6 vagas abertas.",
                promptHint: "Mapeando horários livres na semana...",
                renderCardHTML: () => `
                    <div class="w-full bg-[#13141a] border border-zinc-800 rounded-xl p-3 space-y-2.5">
                        <div class="flex items-center justify-between border-b border-zinc-800/70 pb-2">
                            <span class="text-xs font-medium text-zinc-300 flex items-center gap-1.5">
                                <i class="fa-solid fa-calendar text-zinc-400 text-[11px]"></i> Ocupação Semanal
                            </span>
                            <span class="text-[10px] text-zinc-400 bg-zinc-800/80 border border-zinc-700/60 px-2 py-0.5 rounded-md font-mono">
                                Média 78%
                            </span>
                        </div>

                        <!-- Micro-gráfico elegante e discreto -->
                        <div class="grid grid-cols-6 gap-1.5 pt-1 pb-1">
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-zinc-600 rounded-sm" style="height: 85%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-zinc-400 mt-1">SEG</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-zinc-600 rounded-sm" style="height: 90%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-zinc-400 mt-1">TER</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-zinc-600 rounded-sm" style="height: 80%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-zinc-400 mt-1">QUA</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 border border-amber-600/50 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-amber-500 rounded-sm" style="height: 42%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-amber-300 font-semibold mt-1">QUI</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-zinc-600 rounded-sm" style="height: 92%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-zinc-400 mt-1">SEX</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-full h-10 bg-zinc-900 rounded p-0.5 flex flex-col justify-end">
                                    <div class="w-full bg-zinc-600 rounded-sm" style="height: 98%;"></div>
                                </div>
                                <span class="text-[9px] font-mono text-zinc-400 mt-1">SÁB</span>
                            </div>
                        </div>

                        <div class="text-[11px] text-zinc-300 bg-zinc-900/70 border border-zinc-800/80 px-2.5 py-1.5 rounded-lg flex items-center justify-between">
                            <span class="text-zinc-400">Ociosidade em destaque:</span>
                            <span class="font-medium text-amber-300">Quinta-feira (6 vagas livres)</span>
                        </div>

                        <div class="pt-0.5">
                            <div id="actionButtonSlot" class="btn-smooth w-full py-2 px-3 rounded-lg bg-zinc-900 border border-zinc-700/80 text-zinc-200 text-xs font-medium flex items-center justify-between">
                                <span class="flex items-center gap-2">
                                    <i id="actionBtnIcon" class="fa-solid fa-bolt text-amber-400 text-xs"></i>
                                    <span id="actionBtnText">Criar Campanha "Quinta VIP (-15%)"</span>
                                </span>
                                <span id="actionBtnBadge" class="text-[10px] bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded font-mono">6 vagas</span>
                            </div>
                        </div>
                    </div>
                `,
                onCompleteAction: () => {
                    const btn = document.getElementById('actionButtonSlot');
                    const icon = document.getElementById('actionBtnIcon');
                    const text = document.getElementById('actionBtnText');
                    const badge = document.getElementById('actionBtnBadge');
                    if (!btn) return;

                    btn.className = "btn-smooth w-full py-2 px-3 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center justify-between shadow-sm";
                    if (icon) icon.className = "fa-solid fa-check text-xs text-white";
                    if (text) text.innerText = "Campanha ativada · 4 vagas preenchidas";
                    if (badge) {
                        badge.className = "text-[10px] bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded font-mono";
                        badge.innerText = "Ativo";
                    }
                }
            },
            {
                // CASO 3: Demanda e Faturamento
                user: "Qual serviço teve maior demanda e faturamento este mês?",
                aiText: "Corte & Hidratação liderou a receita com 42 atendimentos gerando R$ 4.200 (ticket médio 32% superior).",
                promptHint: "Consultando faturamento e volume no caixa...",
                renderCardHTML: () => `
                    <div class="w-full bg-[#13141a] border border-zinc-800 rounded-xl p-3 space-y-2.5">
                        <div class="flex items-center justify-between border-b border-zinc-800/70 pb-2">
                            <span class="text-xs font-medium text-zinc-300 flex items-center gap-1.5">
                                <i class="fa-solid fa-chart-simple text-zinc-400 text-[11px]"></i> Ranking de Serviços
                            </span>
                            <span class="text-[10px] text-emerald-400 bg-emerald-950/60 border border-emerald-800/40 px-2 py-0.5 rounded-md font-mono">
                                +18% este mês
                            </span>
                        </div>

                        <!-- Barras de comparação elegantes -->
                        <div class="space-y-2 text-[11px]">
                            <div>
                                <div class="flex justify-between mb-1">
                                    <span class="text-zinc-200 font-medium">1. Corte + Hidratação</span>
                                    <span class="text-emerald-400 font-mono font-medium">R$ 4.200 <span class="text-zinc-500 font-sans">(42)</span></span>
                                </div>
                                <div class="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden">
                                    <div class="h-full bg-emerald-500 rounded-full" style="width: 72%;"></div>
                                </div>
                            </div>

                            <div>
                                <div class="flex justify-between mb-1">
                                    <span class="text-zinc-400">2. Barba Terapia</span>
                                    <span class="text-zinc-300 font-mono">R$ 1.960 <span class="text-zinc-500 font-sans">(28)</span></span>
                                </div>
                                <div class="w-full h-1.5 bg-zinc-900 rounded-full overflow-hidden">
                                    <div class="h-full bg-zinc-600 rounded-full" style="width: 44%;"></div>
                                </div>
                            </div>
                        </div>

                        <div class="text-[11px] text-zinc-400 bg-zinc-900/60 border border-zinc-800/60 px-2.5 py-1.5 rounded-lg flex items-center justify-between">
                            <span>Ticket médio do combo:</span>
                            <span class="text-zinc-200 font-mono font-medium">R$ 100,00</span>
                        </div>

                        <div class="pt-0.5">
                            <div id="actionButtonSlot" class="btn-smooth w-full py-2 px-3 rounded-lg bg-zinc-900 border border-zinc-700/80 text-zinc-200 text-xs font-medium flex items-center justify-between">
                                <span class="flex items-center gap-2">
                                    <i id="actionBtnIcon" class="fa-solid fa-file-invoice-dollar text-emerald-400 text-xs"></i>
                                    <span id="actionBtnText">Ver Fechamento de Caixa</span>
                                </span>
                                <span id="actionBtnBadge" class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded font-mono">PDV</span>
                            </div>
                        </div>
                    </div>
                `,
                onCompleteAction: () => {
                    const btn = document.getElementById('actionButtonSlot');
                    const icon = document.getElementById('actionBtnIcon');
                    const text = document.getElementById('actionBtnText');
                    const badge = document.getElementById('actionBtnBadge');
                    if (!btn) return;

                    btn.className = "btn-smooth w-full py-2 px-3 rounded-lg bg-emerald-600 text-white text-xs font-medium flex items-center justify-between shadow-sm";
                    if (icon) icon.className = "fa-solid fa-check text-xs text-white";
                    if (text) text.innerText = "Extrato financeiro exportado com sucesso";
                    if (badge) {
                        badge.className = "text-[10px] bg-emerald-700 text-emerald-100 px-2 py-0.5 rounded font-mono";
                        badge.innerText = "Pronto";
                    }
                }
            }
        ];

        function playSlide(index) {
            const data = CONVERSATIONS[index];
            currentIdx = index;

            mockPromptBar.placeholder = data.promptHint;

            // 1. Monta o palco com Pergunta do Usuário + Resposta Completa da IA
            stage.innerHTML = `
                <!-- Pergunta do Usuário -->
                <div class="flex flex-col items-end self-end max-w-[90%]">
                    <div class="bg-emerald-950/70 border border-emerald-600/30 text-emerald-100 px-3.5 py-2 rounded-2xl rounded-tr-sm text-xs leading-relaxed font-medium shadow-sm">
                        ${data.user}
                    </div>
                    <span class="text-[9px] text-zinc-500 mt-1 mr-1 font-mono">Agora · Lido</span>
                </div>

                <!-- Resposta da IA com Card Discreto -->
                <div class="flex items-start gap-2.5 self-start w-full">
                    <div class="w-5 h-5 rounded-md bg-emerald-950/80 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-[10px] shrink-0 mt-0.5">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div class="flex-1 space-y-2">
                        <div class="bg-[#14151c] text-zinc-300 px-3 py-2 rounded-xl text-xs leading-relaxed border border-zinc-800/80">
                            ${data.aiText}
                        </div>
                        ${data.renderCardHTML()}
                    </div>
                </div>
            `;

            // 2. Fade In suave do bloco inteiro
            requestAnimationFrame(() => {
                stage.classList.remove('opacity-0', 'translate-y-2');
                stage.classList.add('opacity-100', 'translate-y-0');
            });

            // 3. Após 1.8 segundos de leitura, a ação é concluída suavemente (sem piscar nem re-renderizar o card)
            activeTimer = setTimeout(() => {
                data.onCompleteAction();

                // 4. Aguarda mais 3.8 segundos para o visitante ler tudo com calma
                activeTimer = setTimeout(() => {
                    // 5. Fade out suave
                    stage.classList.remove('opacity-100', 'translate-y-0');
                    stage.classList.add('opacity-0', 'translate-y-2');

                    // 6. Transição para o próximo caso após 450ms (tempo do fade)
                    activeTimer = setTimeout(() => {
                        const nextIndex = (index + 1) % CONVERSATIONS.length;
                        playSlide(nextIndex);
                    }, 450);

                }, 3800);

            }, 1800);
        }

        // Inicia a demonstração automática com transição limpa
        playSlide(0);
    </script>
</body>
</html>
