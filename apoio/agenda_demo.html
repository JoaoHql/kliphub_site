function render(){const active=data[idx];$('datevalue').textContent=`${days[idx]}, ${dates[idx]}`;$('dateSub').textContent=`${days[idx][0]}${days[idx].slice(1).toLowerCase()}, ${dates[idx].split(' ')[0]} de Março de 2026`;$('staffhead').innerHTML='<div class="horalabel">HORA</div>'+staff.map((s,i)=>`<div class="staff"><span class="personicon">${weekdayIcon}</span><span class="personmeta"><b>${s.n}</b><small>${active[i]?.length||0} atend.</small></span><span class="revenue">${s.r}</span></div>`).join('');$('schedule').innerHTML='<div class="times">'+Array.from({length:9},(_,h)=>`<div class="time">${String(8+h).padStart(2,'0')}:00</div>`).join('')+'</div>'+staff.map((_,i)=>`<div class="lane">${(active[i]||[]).map((a,j)=>`<div class="booking ${a.c}" style="top:${a.top}%;height:${a.h}px;animation-delay:${j*.08}s"><b>${a.n}</b><span class="btime">${a.t}</span>${a.s?`<div class="service">${a.s}</div>`:''}${a.st?`<div class="bfoot"><span>${a.v}</span><em>${a.st}</em></div>`:''}</div>`).join('')}</div>`).join('');$('progress').style.width=`${((idx+1)/7)*100}%`}
function go(n){const next=(n+7)%7;const forward=next>=idx;idx=next;render();const inner=document.querySelector('.gridinner');inner.classList.remove('day-enter','day-back');void inner.offsetWidth;inner.classList.add(forward?'day-enter':'day-back');if(timer)toast(`Agenda: ${days[idx][0]}${days[idx].slice(1).toLowerCase()}, ${dates[idx]}`)}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1000)}$('prev').onclick=()=>go(idx-1);$('next').onclick=()=>go(idx+1);function startPlayback(){if(timer)return;$('play').innerHTML='Ⅱ &nbsp; Pausar animação';timer=setInterval(()=>{go(idx===6?0:idx+1)},2200)}function togglePlay(){if(timer){clearInterval(timer);timer=null;$('play').innerHTML='▶ &nbsp; Reproduzir animação';toast('Animação pausada')}else{$('play').innerHTML='Ⅱ &nbsp; Pausar animação';startPlayback()}}$('play').onclick=togglePlay;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);if(e.key==='ArrowLeft')go(idx-1);if(e.code==='Space'){e.preventDefault();togglePlay()}});render();$('play').innerHTML='Ⅱ &nbsp; Pausar animação';setTimeout(startPlayback,900);
</script></body></html>
